[program:zerocoder-bot]
command=/opt/alina-ai-consultant/.venv/bin/python -m alina_bot
directory=/opt/alina-ai-consultant
user=zerocoder
group=zerocoder
environment=PYTHONPATH="/opt/alina-ai-consultant/src",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=10
startretries=5
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/alina-bot/bot.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stdout_capture_maxbytes=1MB
