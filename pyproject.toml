[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alina-ai-consultant"
version = "1.0.1"
description = "ИИ-консультант Zerocoder для сообщества ВКонтакте на GigaChat API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Elsa", email = "elstar883@users.noreply.github.com" }]
keywords = ["vk", "chatbot", "gigachat", "ai", "llm", "rag", "long-poll"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
alina-bot = "alina_bot.bot:main"

[project.urls]
Homepage = "https://github.com/elstar883/alina-ai-consultant"
Issues = "https://github.com/elstar883/alina-ai-consultant/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
